# Default values for application in prod environment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
environment:
  name: production

replicaCount: 1

image:
  repository: registry.gitlab.com/shine-traceability/user-service

service:
  type: NodePort
  port: 80

containers:
  port: 3000

environmentVariables: {}

podAntiAffinity:
  enabled: true
